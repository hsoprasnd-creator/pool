name: Build iOS Dylib

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          brew install ldid

      - name: Setup Theos & SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          mkdir -p $HOME/theos/sdks
          curl -LO https://github.com/theos/sdks/archive/master.tar.gz
          tar -xzf master.tar.gz -C $HOME/theos/sdks --strip-components=1
          rm master.tar.gz

      - name: Write Makefile
        run: |
          cat << 'EOF' > Makefile
          TARGET := iphone:clang:latest:14.0
          ARCHS := arm64

          include $(THEOS)/makefiles/common.mk

          TWEAK_NAME = PoolPrediction

          PoolPrediction_FILES = main.mm ImGuiHook.mm fishhook.c \
                                 imgui/imgui.cpp imgui/imgui_draw.cpp \
                                 imgui/imgui_tables.cpp imgui/imgui_widgets.cpp \
                                 imgui/imgui_impl_metal.mm

          PoolPrediction_CFLAGS += -fobjc-arc -I./imgui -I.
          PoolPrediction_CCFLAGS += -std=c++17 -stdlib=libc++ -I./imgui -I.
          PoolPrediction_CXXFLAGS += -std=c++17 -stdlib=libc++ -I./imgui -I.
          PoolPrediction_OBJCXXFLAGS += -std=c++17 -stdlib=libc++ -fobjc-arc -I./imgui -I.

          PoolPrediction_FRAMEWORKS = UIKit Foundation Metal MetalKit QuartzCore

          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF

      - name: Compile Dylib
        run: |
          export THEOS=$HOME/theos
          make clean
          make all FINALPACKAGE=1

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PoolPrediction-Dylib
          path: .theos/obj/*.dylib
